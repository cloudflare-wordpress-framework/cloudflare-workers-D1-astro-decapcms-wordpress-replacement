<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    window.addEventListener("message", (e) => {
      console.log("Message received from popup:", e.origin, e.data);
      if (typeof e.data === 'string' && e.data.startsWith('authorization:github:success')) {
        console.log("Token successfully received! Decap CMS should log in now.");
        console.log("If it doesn't log in, check the Network tab for failed GitHub API requests (usually 404 for repo not found or lack of permissions).");
      }
    });
  </script>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
